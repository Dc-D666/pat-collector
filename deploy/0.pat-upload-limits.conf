# PatPlayer 上传接口限速/并发 zone 定义（http 上下文 include，供 pat.weaxi.cn.conf 引用）
# P1（2026-08-21）：防未认证访客上传写放大、防并发绕过磁盘空间检查。
# rate 10r/s：单次上传仅 1 个请求，前端逐文件上传（每批 ≤5 个），10r/s 足够；
# burst 20：覆盖快速连续小文件上传；limit_conn 4：同一 IP 最多 4 个并发上传。
limit_req_zone  $binary_remote_addr zone=pat_upload:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=pat_upload_conn:10m;
