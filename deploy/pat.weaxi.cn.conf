# PatPlayer nginx 反代配置（HTTP 301 → HTTPS → 127.0.0.1:3001）
# 与 .env 的 MAX_UPLOAD_MB 对齐 client_max_body_size
#
# ⚠️ 依赖：本配置的 access_log 使用名为 `noquery` 的 log_format（用 $uri 而非 $request_uri，
# 避免把 URL query 里的 token/password 写进访问日志）。
# 该 log_format 定义在 /www/server/panel/vhost/nginx/0.noquery_log_format.conf（http 上下文 include），
# 随本文件一起部署，否则 nginx -t 会报 "unknown log format"。

server {
    listen 80;
    listen [::]:80;
    server_name pat.weaxi.cn www.pat.weaxi.cn;

    # certbot 签发/续签验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www 前缀：证书含 www SAN，握手后 301 归一化到不带 www
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name www.pat.weaxi.cn;

    ssl_certificate     /etc/letsencrypt/live/pat.weaxi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pat.weaxi.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://pat.weaxi.cn$request_uri;
    }

    access_log /www/wwwlogs/pat.weaxi.cn.log noquery;
    error_log /www/wwwlogs/pat.weaxi.cn.error.log;
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name pat.weaxi.cn;

    ssl_certificate     /etc/letsencrypt/live/pat.weaxi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pat.weaxi.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # certbot 续签验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 大文件上传（与 MAX_UPLOAD_MB 对齐）
    client_max_body_size 200m;
    # 全局 proxy.conf 默认开着 proxy_cache cache_one，会吞 Range 请求（视频无法拖动进度条）
    # 且公开 API 响应会被缓存成旧数据；与 speak.weaxi.cn 一致，本站点显式关闭
    proxy_cache off;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 用 $remote_addr（真实客户端 IP）覆盖而非 $proxy_add_x_forwarded_for 追加：
        # Express trust proxy=1 取 XFF 最左值，若客户端自带 XFF 头会被追加为 "伪造值, 真实IP"，
        # 导致 req.ip 可伪造、基于 IP 的限流被绕过。覆盖后 XFF 恒为真实 IP。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /www/wwwlogs/pat.weaxi.cn.log noquery;
    error_log /www/wwwlogs/pat.weaxi.cn.error.log;
}
