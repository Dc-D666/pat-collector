# PatPlayer nginx 反代参考配置（宝塔 vhost 或 /etc/nginx/conf.d 均可用）
# 与 .env 的 MAX_UPLOAD_MB 对齐 client_max_body_size

server {
    listen 80;
    server_name pat.weaxi.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pat.weaxi.cn;

    ssl_certificate     /etc/letsencrypt/live/pat.weaxi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pat.weaxi.cn/privkey.pem;

    # 大文件上传（与 MAX_UPLOAD_MB 对齐）
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
