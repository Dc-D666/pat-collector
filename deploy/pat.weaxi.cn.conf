# PatPlayer nginx 反代配置（HTTP 301 → HTTPS → 127.0.0.1:3001）
# 与 .env 的 MAX_UPLOAD_MB 对齐 client_max_body_size

server {
    listen 80;
    listen [::]:80;
    server_name pat.weaxi.cn;

    # certbot 签发/续签验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name pat.weaxi.cn;

    ssl_certificate     /etc/letsencrypt/live/pat.weaxi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pat.weaxi.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # certbot 续签验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 大文件上传（与 MAX_UPLOAD_MB 对齐）
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /www/wwwlogs/pat.weaxi.cn.log;
    error_log /www/wwwlogs/pat.weaxi.cn.error.log;
}
