<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Referrer-Policy" content="no-referrer" />
  <title>作品预览</title>
  <style>html,body{margin:0;height:100%;background:#fff}#pv{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="pv" sandbox="allow-scripts" title="作品预览"></iframe>
<script>
// 安全预览壳（2026-08-20 修复）：
// 旧实现把登录令牌放在预览 URL（/api/files/preview/:id?token=...），CSP sandbox 阻止不了上传的
// HTML 读取自身 location.href 外传令牌 → 任意登录用户（含管理员）账号可被窃取（存储型 XSS 链）。
// 现在：令牌只经请求头传递（登录用户从 localStorage 读，访客令牌经本页 hash 传入——访客令牌本就是
// 随项目地址分享的 URL 凭据）；上传内容经 blob URL 注入 sandbox iframe（allow-scripts、无 allow-same-origin，
// unique origin），上传页面读不到父壳的任何信息，也读不到自己的 URL（blob:...），令牌无外传路径。
(function () {
  var m = (location.hash || '').match(/^#\/(file|guest)\/(\d+)(?:\/([A-Za-z0-9]+))?/);
  if (!m) { document.body.textContent = '预览参数错误'; return; }
  var kind = m[1];
  var id = m[2];
  var gt = m[3] || '';
  var headers = {};
  var err = null;
  if (kind === 'file') {
    var t = null;
    try { t = localStorage.getItem('patplayer_token'); } catch (e) { /* ignore */ }
    if (!t) { err = '未登录，无法预览'; }
    else { headers.Authorization = 'Bearer ' + t; }
  } else {
    if (!gt) { err = '项目地址无效'; }
    else { headers['x-guest-token'] = gt; }
  }
  if (err) { document.body.textContent = err; return; }

  var api = '/api/' + (kind === 'file' ? 'files' : 'guest') + '/preview/' + encodeURIComponent(id);
  fetch(api, { headers: headers })
    .then(function (r) {
      if (!r.ok) return r.json().then(function (j) { throw new Error((j && j.error) || '预览失败'); });
      return r.text();
    })
    .then(function (html) {
      var f = document.getElementById('pv');
      if (!f) return;
      var blob = new Blob([html], { type: 'text/html' });
      f.src = URL.createObjectURL(blob);
    })
    .catch(function (e) { document.body.textContent = e.message || '预览失败'; });
})();
</script>
</body>
</html>
